[project]
name = "idees-voyages-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=40.36.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
# Auto-generated by `alembic revision --autogenerate`; regenerated each time,
# so not worth hand-formatting to project style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
extend-select = ["D"]
# Only require docstrings on functions/methods; module, class, and package
# docstrings are not enforced.
ignore = ["D100", "D101", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are descriptive enough on their own; don't require docstrings.
"tests/**" = ["D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
